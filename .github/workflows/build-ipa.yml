name: BionicSX2 — Build IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14  # Apple Silicon runner — arm64 native

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ─── 2. Verify submodules ────────────────────────────────────
      - name: Verify and init submodules
        run: |
          git submodule status
          echo "--- Checking critical 3rdparty deps ---"
          for dep in fmt fast_float cpuinfo ryml; do
            if [ -d "pcsx2/3rdparty/$dep" ]; then
              echo "OK: $dep"
            else
              echo "MISSING: $dep — build will fail"
              exit 1
            fi
          done
          echo "--- Init nested submodules inside pcsx2 ---"
          cd pcsx2 && git submodule update --init --recursive && cd ..

      # ─── 3. Xcode version ──────────────────────────────────────────
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Xcode version
        run: xcodebuild -version

      # ─── 4. CMake + Dependencies ─────────────────────────────────
      - name: Install CMake and dependencies
        run: |
          brew install cmake ninja \
            jpeg-turbo libpng webp \
            pkg-config

      # ─── 5. Configure ──────────────────────────────────────────────
      - name: Configure CMake for iOS
        run: |
          cmake -B build \
            -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios.toolchain.cmake \
            -DPCSX2_TARGET_IOS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISABLE_PCSX2_RECOMPILER=ON \
            -DDISABLE_VULKAN=ON \
            -DDISABLE_ANDROID=ON \
            -D_M_ARM64=ON

      # ─── 6. Build ──────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel

      # ─── 7. Archive (unsigned IPA) ─────────────────────────────────
      - name: Archive IPA
        run: xcodebuild archive -project build/BionicSX2.xcodeproj -target BionicSX2 -sdk iphoneos -archivePath build/BionicSX2.xcarchive ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      # ─── 8. Export unsigned IPA ────────────────────────────────────
      - name: Export IPA
        run: |
          mkdir -p build/ipa
          cp -r build/BionicSX2.xcarchive/Products/Applications/BionicSX2.app \
            build/ipa/
          cd build/ipa
          mkdir Payload
          cp -r BionicSX2.app Payload/
          zip -r BionicSX2.ipa Payload/

      # ─── 9. Upload artifact ────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BionicSX2-unsigned
          path: build/ipa/BionicSX2.ipa
          retention-days: 30
